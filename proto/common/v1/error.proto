syntax = "proto3";

package common.v1;

option go_package = "github.com/AndrewK4758/aklapper/packages/go/kit/gen/common/v1;commonv1";

message FieldErrorList {
  repeated string messages = 1;
}

message PublicAppError {
  string code = 1;
  int32 status = 2;
  string message = 3;
  string action = 4;
  string correlation_id = 5;
  map<string, FieldErrorList> field_errors = 6;
}

message QuotaStatus {
  string role = 1;
  int32 turns_used = 2;
  int32 max_turns = 3;
  int32 tokens_used = 4;
  int32 max_tokens = 5;
}

message PrivacySanitizationFinding {
  string rule_id = 1;
  string category = 2;
  string field = 3;
  string location = 4;
}

message ErrorDetailEnvelope {
  PublicAppError error = 1;
  QuotaStatus quota = 2;
  optional int32 retry_after_seconds = 3;
  repeated PrivacySanitizationFinding sanitization_findings = 4;
}
