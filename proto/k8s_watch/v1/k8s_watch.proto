syntax = "proto3";

package k8s_watch.v1;

option go_package = "github.com/AndrewK4758/aklapper/packages/go/kit/gen/k8s_watch/v1;k8s_watchv1";

service K8sWatchService {
  rpc StreamClusterEvents(StreamClusterEventsRequest) returns (stream StreamClusterEventsResponse);
  rpc WakeDeployment(WakeDeploymentRequest) returns (WakeDeploymentResponse);
}

message StreamClusterEventsRequest {
  repeated string namespaces = 1;
}

message K8sPodEvent {
  string event_id = 1;
  string namespace = 2;
  string deployment = 3;
  string pod_name = 4;
  string phase = 5;
  bool ready = 6;
  string message = 7;
  string timestamp = 8;
}

message StreamClusterEventsResponse {
  K8sPodEvent event = 1;
}

message WakeDeploymentRequest {
  string deployment = 1;
}

message WakeDeploymentResponse {
  K8sPodEvent event = 1;
  string osc7501 = 2;
}
