[tool.coverage.run]
branch = true
source = ["rag_example"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/apps/python/rag-example/html'
 --cov-report xml:'../../../coverage/apps/python/rag-example/coverage.xml'
 --html='../../../reports/apps/python/rag-example/unittests/html/index.html'
 --junitxml='../../../reports/apps/python/rag-example/unittests/junit.xml'
"""

[tool.poetry]
name = "rag-example"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = []
license = 'Proprietary'
readme = 'README.md'

[[tool.poetry.packages]]
include = "rag_example"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
chromadb = "^1.2.0"
langchain = "^1.0.0"
langchain-community = "^0.4"
langchain-ollama = "^1.0.0"
langgraph = "^1.0.0"
pymupdf = "^1.26.5"
langchain-chroma = "^1.0.0"
onnxruntime-gpu = "^1.23.0"
sentence-transformers = "^5.1.1"

[tool.poetry.group.dev.dependencies]
autopep8 = "2.3.1"
flake8 = "7.1.1"
pytest = "8.3.4"
pytest-sugar = "1.0.0"
pytest-cov = "6.0.0"
pytest-html = "4.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
