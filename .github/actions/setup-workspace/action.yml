name: Setup aklapper workspace
description: Installs pnpm, Node.js, and optional Go, restores pnpm and Go caches, and installs dependencies offline-first.

inputs:
  pnpm-version:
    description: pnpm version
    required: false
    default: '12.23.0'
  node-version:
    description: Node.js version
    required: false
    default: '26.13.1'
  go-version:
    description: Go version (used when setup-go is true)
    required: false
    default: '1.27'
  setup-go:
    description: Whether to install Go and restore Go module/build caches
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Install Node.js & restore pnpm store cache
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install Go & restore Go caches
      if: inputs.setup-go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        cache-dependency-path: '**/go.sum'

    # Note: Nx 24 binds local SQLite cache metadata (~/.nx/<id>/databases/<machine-id>-v6.db)
    # to /etc/machine-id, so archiving/restoring ~/.nx across ephemeral GitHub VM runners
    # triggers "Unrecognized Cache Artifacts" with 0% hit rate; remote caching uses Nx Cloud.

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
