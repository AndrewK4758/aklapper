name: Setup aklapper workspace
description: Installs pnpm, Node.js, optional Go, restores pnpm and Nx caches, and installs dependencies offline-first.

inputs:
  pnpm-version:
    description: pnpm version
    required: false
    default: '12.23.0'
  node-version:
    description: Node.js version
    required: false
    default: '26.13.1'
  go-version:
    description: Go version (used when setup-go is true)
    required: false
    default: '1.27'
  setup-go:
    description: Whether to install Go and restore Go module/build caches
    required: false
    default: 'false'
  restore-nx-cache:
    description: Whether to restore/save local .nx/cache alongside Nx Cloud
    required: false
    default: 'true'
  cache-scope:
    description: Job-specific scope for .nx/cache key to avoid parallel save collisions
    required: false
    default: 'default'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Install Node.js & restore pnpm store cache
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install Go & restore Go caches
      if: inputs.setup-go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        cache-dependency-path: '**/go.sum'

    - name: Restore local Nx cache (.nx/cache)
      if: inputs.restore-nx-cache == 'true'
      uses: actions/cache@v6
      with:
        path: .nx/cache
        key: nx-cache-${{ runner.os }}-${{ inputs.cache-scope }}-${{ github.sha }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          nx-cache-${{ runner.os }}-${{ inputs.cache-scope }}-
          nx-cache-${{ runner.os }}-build-
          nx-cache-${{ runner.os }}-

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
