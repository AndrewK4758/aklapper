name: aklapper CI

on:
  pull_request:
    branches:
      - main
      - portfolio_v2
  push:
    branches:
      - main
      - portfolio_v2
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  PNPM_VERSION: 12.23.0
  NODE_VERSION: 26.13.1
  GO_VERSION: '1.27'

jobs:
  verify:
    name: Format, lint, test, build & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (oxfmt)
        run: pnpm format:check

      - name: Lint, test, build, and typecheck
        run: pnpm exec nx run-many -t lint test build typecheck --verbose

      - name: Upload built SSR artifacts for Playwright E2E
        uses: actions/upload-artifact@v4
        with:
          name: ssr-dist-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            apps/portal/portal/dist
            apps/admin/admin/dist
            packages/node/ssr-server/dist
            packages/shared/ui/dist
            packages/shared/contracts/dist
            packages/shared/utils/dist
            packages/shared/analytics/dist

  e2e:
    name: E2E (${{ matrix.app }} / ${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - portal-e2e
          - admin-e2e
        project:
          - chromium
          - firefox
          - webkit
          - mobile-chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built SSR artifacts
        uses: actions/download-artifact@v4
        with:
          name: ssr-dist-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Resolve Playwright browser binary
        id: browser
        shell: bash
        run: |
          if [ "${{ matrix.project }}" = "mobile-chrome" ]; then
            echo "binary=chromium" >> "$GITHUB_OUTPUT"
          else
            echo "binary=${{ matrix.project }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.binary }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser & system dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps "${{ steps.browser.outputs.binary }}"
          else
            pnpm exec playwright install --with-deps "${{ steps.browser.outputs.binary }}"
          fi

      - name: Run Playwright E2E suite
        run: pnpm exec nx run ${{ matrix.app }}:e2e -- --project=${{ matrix.project }}

      - name: Upload Playwright report & failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.app }}-${{ matrix.project }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            apps/portal/portal-e2e/playwright-report
            apps/portal/portal-e2e/test-results
            apps/admin/admin-e2e/playwright-report
            apps/admin/admin-e2e/test-results

  docker-build-check:
    name: Docker build check (${{ matrix.service }})
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: portal
            dockerfile: apps/portal/portal/Dockerfile
          - service: admin
            dockerfile: apps/admin/admin/Dockerfile
          - service: node-api-auth
            dockerfile: apis/node/auth/auth/Dockerfile
          - service: node-api-analytics
            dockerfile: apis/node/analytics/analytics/Dockerfile
          - service: k8s-watch
            dockerfile: apis/go/k8s-watch/k8s-watch/Dockerfile
          - service: cadence-demo
            dockerfile: apis/go/cadence-demo/cadence-demo/Dockerfile
          - service: ai-ask
            dockerfile: apis/go/ai-ask/ai-ask/Dockerfile
          - service: contact
            dockerfile: apis/go/contact/contact/Dockerfile
          - service: cadence-admin
            dockerfile: apis/go/cadence-admin/cadence-admin/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
