name: GCP CI/CD Deploy

# =============================================================================
# Hybrid GCP Deployment Pipeline (Cloud Run + GKE Autopilot)
#
# Required GitHub Environment Secrets (staging & production):
#   - GCP_WORKLOAD_IDENTITY_PROVIDER : projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   - GCP_WIF_SERVICE_ACCOUNT        : <deployer-sa>@<project-id>.iam.gserviceaccount.com
#   - DATABASE_URL                   : PostgreSQL 19 connection string for portal & admin SSR loaders
#
# Required GitHub Environment / Repository Variables:
#   - GCP_PROJECT_ID                 : Target GCP project ID
#   - GCP_REGION                     : Artifact Registry / Cloud Run region (default: us-central1)
#   - GAR_REPOSITORY                 : Artifact Registry Docker repo name (default: aklapper)
#
# Optional Variables:
#   - GKE_CLUSTER_NAME               : GKE Autopilot cluster name (GKE rollout skipped cleanly if unset)
#   - GKE_CLUSTER_LOCATION           : GKE cluster region/zone (defaults to GCP_REGION)
#   - PORTAL_MAINTENANCE_MODE        : 'true' | 'false' (default: 'false')
#   - CLOUD_RUN_ALLOW_UNAUTH_ADMIN   : 'true' | 'false' (default: 'false')
#   - CLOUD_RUN_ALLOW_UNAUTH_APIS    : 'true' | 'false' (default: 'false')
# =============================================================================

on:
  push:
    branches:
      - portfolio_v2
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target GCP environment
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      deploy_cloud_run:
        description: Deploy SSR web apps and Node APIs to Cloud Run
        type: boolean
        default: true
      deploy_gke:
        description: Apply manifests and roll out Go services to GKE Autopilot
        type: boolean
        default: true
      run_smoke_e2e:
        description: Run post-deploy Playwright E2E smoke suite against live URLs
        type: boolean
        default: true

concurrency:
  group: cd-gcp-${{ github.event.inputs.target_environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  PNPM_VERSION: 12.23.0
  NODE_VERSION: 26.13.1

jobs:
  resolve-env:
    name: Resolve deployment environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      service_suffix: ${{ steps.resolve.outputs.service_suffix }}
      deploy_cloud_run: ${{ steps.resolve.outputs.deploy_cloud_run }}
      deploy_gke: ${{ steps.resolve.outputs.deploy_gke }}
      run_smoke_e2e: ${{ steps.resolve.outputs.run_smoke_e2e }}

    steps:
      - name: Determine target environment
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_NAME="${{ github.event.inputs.target_environment }}"
            DEPLOY_CLOUD_RUN="${{ github.event.inputs.deploy_cloud_run }}"
            DEPLOY_GKE="${{ github.event.inputs.deploy_gke }}"
            RUN_SMOKE_E2E="${{ github.event.inputs.run_smoke_e2e }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV_NAME="production"
            DEPLOY_CLOUD_RUN="true"
            DEPLOY_GKE="true"
            RUN_SMOKE_E2E="true"
          else
            ENV_NAME="staging"
            DEPLOY_CLOUD_RUN="true"
            DEPLOY_GKE="true"
            RUN_SMOKE_E2E="true"
          fi

          if [ "$ENV_NAME" = "production" ]; then
            SERVICE_SUFFIX=""
          else
            SERVICE_SUFFIX="-staging"
          fi

          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "service_suffix=${SERVICE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "deploy_cloud_run=${DEPLOY_CLOUD_RUN}" >> "$GITHUB_OUTPUT"
          echo "deploy_gke=${DEPLOY_GKE}" >> "$GITHUB_OUTPUT"
          echo "run_smoke_e2e=${RUN_SMOKE_E2E}" >> "$GITHUB_OUTPUT"

  ci-gate:
    name: Pre-deploy CI & Playwright E2E gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & push (${{ matrix.service }})
    needs:
      - resolve-env
      - ci-gate
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: portal
            dockerfile: apps/portal/portal/Dockerfile
          - service: admin
            dockerfile: apps/admin/admin/Dockerfile
          - service: node-api-auth
            dockerfile: apis/node/auth/auth/Dockerfile
          - service: node-api-analytics
            dockerfile: apis/node/analytics/analytics/Dockerfile
          - service: k8s-watch
            dockerfile: apis/go/k8s-watch/k8s-watch/Dockerfile
          - service: cadence-demo
            dockerfile: apis/go/cadence-demo/cadence-demo/Dockerfile
          - service: ai-ask
            dockerfile: apis/go/ai-ask/ai-ask/Dockerfile
          - service: contact
            dockerfile: apis/go/contact/contact/Dockerfile
          - service: cadence-admin
            dockerfile: apis/go/cadence-admin/cadence-admin/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GCP deployment variables
        shell: bash
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "::error::Missing required GitHub variable GCP_PROJECT_ID for environment ${{ needs.resolve-env.outputs.env_name }}."
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/${{ matrix.service }}:${{ github.sha }}
            ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/${{ matrix.service }}:${{ needs.resolve-env.outputs.env_name }}-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-cloud-run:
    name: Deploy Cloud Run (${{ needs.resolve-env.outputs.env_name }})
    needs:
      - resolve-env
      - build-and-push
    if: needs.resolve-env.outputs.deploy_cloud_run == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}
    outputs:
      portal_url: ${{ steps.deploy-portal.outputs.url }}
      admin_url: ${{ steps.deploy-admin.outputs.url }}

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Deploy portal SSR to Cloud Run
        id: deploy-portal
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: aklapper-portal${{ needs.resolve-env.outputs.service_suffix }}
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/portal:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            PORTAL_MAINTENANCE_MODE=${{ vars.PORTAL_MAINTENANCE_MODE || 'false' }}
            PUBLIC_PORTAL_URL=${{ vars.PUBLIC_PORTAL_URL || 'https://andrew-k.us' }}
            PUBLIC_ANALYTICS_ENDPOINT=${{ vars.PUBLIC_ANALYTICS_ENDPOINT || '' }}
            PUBLIC_GA_MEASUREMENT_ID=${{ vars.PUBLIC_GA_MEASUREMENT_ID || '' }}
            PUBLIC_GTM_ID=${{ vars.PUBLIC_GTM_ID || '' }}
            PUBLIC_GSC_VERIFICATION=${{ vars.PUBLIC_GSC_VERIFICATION || '' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --min-instances=0
            --max-instances=5
            --memory=512Mi
            --cpu=1
            --cpu-throttling

      - name: Deploy admin SSR to Cloud Run
        id: deploy-admin
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: aklapper-admin${{ needs.resolve-env.outputs.service_suffix }}
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/admin:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            PUBLIC_ADMIN_URL=${{ vars.PUBLIC_ADMIN_URL || 'https://admin.andrew-k.us' }}
            PUBLIC_ANALYTICS_ENDPOINT=${{ vars.PUBLIC_ANALYTICS_ENDPOINT || '' }}
            PUBLIC_GA_MEASUREMENT_ID=${{ vars.PUBLIC_GA_MEASUREMENT_ID || '' }}
            PUBLIC_GTM_ID=${{ vars.PUBLIC_GTM_ID || '' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          flags: >-
            ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_ADMIN == 'true' && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            --port=8080
            --min-instances=0
            --max-instances=2
            --memory=512Mi
            --cpu=1
            --cpu-throttling

      - name: Deploy node-api-auth to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: aklapper-api-auth${{ needs.resolve-env.outputs.service_suffix }}
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/node-api-auth:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
          flags: >-
            ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_APIS == 'true' && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            --port=8080
            --min-instances=0
            --max-instances=3
            --memory=256Mi
            --cpu=1
            --cpu-throttling

      - name: Deploy node-api-analytics to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: aklapper-api-analytics${{ needs.resolve-env.outputs.service_suffix }}
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/node-api-analytics:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
          flags: >-
            ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_APIS == 'true' && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            --port=8080
            --min-instances=0
            --max-instances=3
            --memory=256Mi
            --cpu=1
            --cpu-throttling

      - name: Write Cloud Run deployment summary
        shell: bash
        run: |
          {
            echo "### Cloud Run Deploy (${{ needs.resolve-env.outputs.env_name }})"
            echo "- Portal: ${{ steps.deploy-portal.outputs.url }}"
            echo "- Admin: ${{ steps.deploy-admin.outputs.url }}"
            echo "- Image tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-gke:
    name: Deploy GKE Autopilot Go services (${{ needs.resolve-env.outputs.env_name }})
    needs:
      - resolve-env
      - build-and-push
    if: needs.resolve-env.outputs.deploy_gke == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GKE cluster configuration
        id: gke-check
        shell: bash
        run: |
          if [ -z "${{ vars.GKE_CLUSTER_NAME }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GKE Autopilot Deploy Skipped"
              echo "Set \`GKE_CLUSTER_NAME\` in the \`${{ needs.resolve-env.outputs.env_name }}\` environment to enable Go microservice rollout. All 5 Go images were built and pushed to Artifact Registry with tag \`${{ github.sha }}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: steps.gke-check.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Fetch GKE Autopilot credentials
        if: steps.gke-check.outputs.configured == 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION || vars.GCP_REGION || 'us-central1' }}

      - name: Apply base namespaces, quotas, and network policies
        if: steps.gke-check.outputs.configured == 'true'
        shell: bash
        run: |
          kubectl apply -f infra/k8s/base/namespaces.yaml
          kubectl apply -f infra/k8s/base/quotas-limits.yaml
          kubectl apply -f infra/k8s/base/network-policies.yaml

      - name: Render and apply Go microservice deployments with immutable SHA tags
        if: steps.gke-check.outputs.configured == 'true'
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'aklapper' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for manifest in infra/k8s/portfolio-public/deployments.yaml infra/k8s/cadence-admin/deployment.yaml; do
            sed \
              -e "s|us-central1-docker.pkg.dev/PROJECT_ID/aklapper/|${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/|g" \
              -e "s|:latest|:${IMAGE_TAG}|g" \
              "$manifest" | kubectl apply -f -
          done

  post-deploy-e2e:
    name: Live E2E smoke (${{ matrix.project }})
    needs:
      - resolve-env
      - deploy-cloud-run
    if: >-
      needs.resolve-env.outputs.run_smoke_e2e == 'true' &&
      needs.deploy-cloud-run.outputs.portal_url != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - mobile-chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright browser binary
        id: browser
        shell: bash
        run: |
          if [ "${{ matrix.project }}" = "mobile-chrome" ]; then
            echo "binary=chromium" >> "$GITHUB_OUTPUT"
          else
            echo "binary=${{ matrix.project }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.binary }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser & system dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps "${{ steps.browser.outputs.binary }}"
          else
            pnpm exec playwright install --with-deps "${{ steps.browser.outputs.binary }}"
          fi

      - name: Run live Playwright smoke against deployed portal
        env:
          PORTAL_BASE_URL: ${{ needs.deploy-cloud-run.outputs.portal_url }}
          PORTAL_MAINTENANCE_MODE: ${{ vars.PORTAL_MAINTENANCE_MODE || 'false' }}
        run: pnpm --dir apps/portal/portal-e2e exec playwright test --project=${{ matrix.project }}

      - name: Run live Playwright smoke against deployed admin (when public)
        if: vars.CLOUD_RUN_ALLOW_UNAUTH_ADMIN == 'true' && needs.deploy-cloud-run.outputs.admin_url != ''
        env:
          ADMIN_BASE_URL: ${{ needs.deploy-cloud-run.outputs.admin_url }}
        run: pnpm --dir apps/admin/admin-e2e exec playwright test --project=${{ matrix.project }}

      - name: Upload live smoke Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-${{ needs.resolve-env.outputs.env_name }}-${{ matrix.project }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            apps/portal/portal-e2e/playwright-report
            apps/portal/portal-e2e/test-results
            apps/admin/admin-e2e/playwright-report
            apps/admin/admin-e2e/test-results
