name: GCP CI/CD Deploy

# =============================================================================
# Hybrid GCP Deployment Pipeline (Cloud Run + GKE Autopilot)
#
# Manual dispatch ONLY (`workflow_dispatch`) — CD never runs automatically on
# any push or PR so zero cloud build/deploy costs occur without explicit action.
#
# Required GitHub Environment Secrets (staging & production):
#   - GCP_WORKLOAD_IDENTITY_PROVIDER : projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   - GCP_WIF_SERVICE_ACCOUNT        : <deployer-sa>@<project-id>.iam.gserviceaccount.com
#   - DATABASE_URL                   : PostgreSQL 19 connection string for portal, admin, and Node APIs
#   - INTERNAL_AUTH_SECRET           : HMAC-SHA256 signing secret for X-Internal-Auth between BFFs and APIs
#   - TOTP_ENCRYPTION_KEY            : AES-256-GCM key material for encrypted admin TOTP secrets
#   - ANALYTICS_DAILY_SALT           : Secret salt for daily visitor IP hashing in analytics ingestion
#
# Pre-deploy Prerequisite:
#   - Seed admin password credentials (`ADMIN_HANDLE` / `ADMIN_PASSWORD`) via `pnpm db:seed` against target `DATABASE_URL` before deploying Cloud Run services.
#
# Required GitHub Environment / Repository Variables:
#   - GCP_PROJECT_ID                 : Target GCP project ID
#   - GCP_REGION                     : Artifact Registry / Cloud Run region (default: us-central1)
#   - GAR_REPOSITORY                 : Artifact Registry Docker repo name (default: aklapper)
#
# Optional Variables:
#   - GKE_CLUSTER_NAME               : GKE Autopilot cluster name (GKE rollout skipped cleanly if unset)
#   - GKE_CLUSTER_LOCATION           : GKE cluster region/zone (defaults to GCP_REGION)
#   - PORTAL_MAINTENANCE_MODE        : 'true' | 'false' (default: 'false')
#   - WEBAUTHN_RP_ID                 : Relying party ID for passkeys (default: admin.andrew-k.us)
#   - WEBAUTHN_RP_NAME               : Relying party display name (default: andrew-k.us Admin)
#   - WEBAUTHN_ORIGIN                : Expected WebAuthn origin (defaults to PUBLIC_ADMIN_URL)
#   - AUTH_API_URL / ANALYTICS_API_URL : Override Cloud Run API URLs (defaults to deployed service URLs)
#   - K8S_WATCH_URL / CADENCE_DEMO_URL / AI_ASK_URL / CADENCE_ADMIN_URL / CONTACT_API_URL / QDRANT_URL
#   - CLOUD_RUN_ALLOW_UNAUTH_ADMIN   : 'true' | 'false' (default: 'false')
#   - CLOUD_RUN_ALLOW_UNAUTH_APIS    : 'true' | 'false' (default: 'false')
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target GCP environment
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      deploy_all_services:
        description: Build & deploy all 9 services (unchecked = only Nx affected services since base_ref)
        type: boolean
        default: false
      base_ref:
        description: Base git ref/SHA for Nx affected deploy diff (defaults to HEAD~1)
        type: string
        default: HEAD~1
      skip_ci_gate:
        description: Skip pre-deploy CI gate (use only when CI already passed for this exact SHA)
        type: boolean
        default: false
      deploy_cloud_run:
        description: Deploy affected SSR web apps and Node APIs to Cloud Run
        type: boolean
        default: true
      deploy_gke:
        description: Apply manifests and roll out affected Go services to GKE Autopilot
        type: boolean
        default: true
      run_smoke_e2e:
        description: Run post-deploy Playwright E2E smoke suite against live URLs
        type: boolean
        default: true
      smoke_all_browsers:
        description: Run live smoke across chromium, firefox, and webkit (unchecked = chromium + mobile-chrome only)
        type: boolean
        default: false

concurrency:
  group: cd-gcp-${{ inputs.target_environment }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  PNPM_VERSION: 12.23.0
  NODE_VERSION: 26.13.1
  NX_DAEMON: 'false'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  resolve-plan:
    name: Resolve deployment environment & affected services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      service_suffix: ${{ steps.resolve.outputs.service_suffix }}
      deploy_cloud_run: ${{ steps.resolve.outputs.deploy_cloud_run }}
      deploy_gke: ${{ steps.resolve.outputs.deploy_gke }}
      run_smoke_e2e: ${{ steps.resolve.outputs.run_smoke_e2e }}
      smoke_engines_json: ${{ steps.resolve.outputs.smoke_engines_json }}
      has_docker: ${{ steps.plan.outputs.has_docker }}
      has_cloud_run: ${{ steps.plan.outputs.has_cloud_run }}
      has_gke: ${{ steps.plan.outputs.has_gke }}
      docker_matrix_json: ${{ steps.plan.outputs.docker_matrix_json }}
      cloud_run_services_json: ${{ steps.plan.outputs.cloud_run_services_json }}
      gke_services_json: ${{ steps.plan.outputs.gke_services_json }}

    steps:
      - name: Checkout full history for Nx affected
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          restore-nx-cache: 'false'

      - name: Determine target environment and smoke matrix
        id: resolve
        shell: bash
        env:
          INPUT_TARGET_ENV: ${{ inputs.target_environment }}
          INPUT_DEPLOY_CLOUD_RUN: ${{ inputs.deploy_cloud_run }}
          INPUT_DEPLOY_GKE: ${{ inputs.deploy_gke }}
          INPUT_RUN_SMOKE_E2E: ${{ inputs.run_smoke_e2e }}
          INPUT_SMOKE_ALL_BROWSERS: ${{ inputs.smoke_all_browsers }}
        run: |
          if [ "$INPUT_TARGET_ENV" = "production" ]; then
            SERVICE_SUFFIX=""
          else
            SERVICE_SUFFIX="-staging"
          fi

          if [ "$INPUT_SMOKE_ALL_BROWSERS" = "true" ]; then
            SMOKE_ENGINES='["chromium","firefox","webkit"]'
          else
            SMOKE_ENGINES='["chromium"]'
          fi

          echo "env_name=${INPUT_TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "service_suffix=${SERVICE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "deploy_cloud_run=${INPUT_DEPLOY_CLOUD_RUN}" >> "$GITHUB_OUTPUT"
          echo "deploy_gke=${INPUT_DEPLOY_GKE}" >> "$GITHUB_OUTPUT"
          echo "run_smoke_e2e=${INPUT_RUN_SMOKE_E2E}" >> "$GITHUB_OUTPUT"
          echo "smoke_engines_json=${SMOKE_ENGINES}" >> "$GITHUB_OUTPUT"

      - name: Compute affected deploy services
        id: plan
        shell: bash
        env:
          INPUT_DEPLOY_ALL: ${{ inputs.deploy_all_services }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
        run: |
          if [ "$INPUT_DEPLOY_ALL" = "true" ]; then
            node --conditions=@aklapper/source packages/tooling/src/ci-plan.ts --all
          else
            node --conditions=@aklapper/source packages/tooling/src/ci-plan.ts --base="$INPUT_BASE_REF" --head=HEAD
          fi

  ci-gate:
    name: Pre-deploy CI & Playwright E2E gate
    if: inputs.skip_ci_gate != true
    uses: ./.github/workflows/ci.yml
    with:
      run_all: ${{ inputs.deploy_all_services }}
      base_ref: ${{ inputs.base_ref }}
    secrets: inherit

  build-and-push:
    name: Build & push (${{ matrix.service }})
    needs:
      - resolve-plan
      - ci-gate
    if: >-
      always() &&
      needs.resolve-plan.result == 'success' &&
      (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') &&
      needs.resolve-plan.outputs.has_docker == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-plan.outputs.env_name }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-plan.outputs.docker_matrix_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate GCP deployment variables
        shell: bash
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "::error::Missing required GitHub variable GCP_PROJECT_ID for environment ${{ needs.resolve-plan.outputs.env_name }}."
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/${{ matrix.service }}:${{ github.sha }}
            ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/${{ matrix.service }}:${{ needs.resolve-plan.outputs.env_name }}-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-cloud-run:
    name: Deploy Cloud Run (${{ needs.resolve-plan.outputs.env_name }})
    needs:
      - resolve-plan
      - build-and-push
    if: >-
      needs.resolve-plan.outputs.deploy_cloud_run == 'true' &&
      needs.resolve-plan.outputs.has_cloud_run == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-plan.outputs.env_name }}
    outputs:
      portal_url: ${{ steps.resolve-urls.outputs.portal_url }}
      admin_url: ${{ steps.resolve-urls.outputs.admin_url }}

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy node-api-auth to Cloud Run
        id: deploy-api-auth
        if: contains(fromJson(needs.resolve-plan.outputs.cloud_run_services_json), 'node-api-auth')
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: aklapper-api-auth${{ needs.resolve-plan.outputs.service_suffix }}
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/node-api-auth:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            WEBAUTHN_RP_ID=${{ vars.WEBAUTHN_RP_ID || 'admin.andrew-k.us' }}
            WEBAUTHN_RP_NAME=${{ vars.WEBAUTHN_RP_NAME || 'andrew-k.us Admin' }}
            WEBAUTHN_ORIGIN=${{ vars.WEBAUTHN_ORIGIN || vars.PUBLIC_ADMIN_URL || 'https://admin.andrew-k.us' }}
            TOTP_ENCRYPTION_KEY=${{ secrets.TOTP_ENCRYPTION_KEY }}
            INTERNAL_AUTH_SECRET=${{ secrets.INTERNAL_AUTH_SECRET }}
          flags: >-
            ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_APIS == 'true' && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            --port=8080
            --min-instances=0
            --max-instances=3
            --memory=256Mi
            --cpu=1
            --cpu-throttling

      - name: Deploy node-api-analytics to Cloud Run
        id: deploy-api-analytics
        if: contains(fromJson(needs.resolve-plan.outputs.cloud_run_services_json), 'node-api-analytics')
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: aklapper-api-analytics${{ needs.resolve-plan.outputs.service_suffix }}
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/node-api-analytics:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ANALYTICS_DAILY_SALT=${{ secrets.ANALYTICS_DAILY_SALT }}
            INTERNAL_AUTH_SECRET=${{ secrets.INTERNAL_AUTH_SECRET }}
          flags: >-
            ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_APIS == 'true' && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            --port=8080
            --min-instances=0
            --max-instances=3
            --memory=256Mi
            --cpu=1
            --cpu-throttling

      - name: Resolve live Cloud Run API URLs for SSR apps
        id: api-urls
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE_SUFFIX: ${{ needs.resolve-plan.outputs.service_suffix }}
        run: |
          AUTH_URL="${{ vars.AUTH_API_URL || steps.deploy-api-auth.outputs.url }}"
          if [ -z "$AUTH_URL" ]; then
            AUTH_URL="$(gcloud run services describe "aklapper-api-auth${SERVICE_SUFFIX}" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' 2>/dev/null || true)"
          fi

          ANALYTICS_URL="${{ vars.ANALYTICS_API_URL || steps.deploy-api-analytics.outputs.url }}"
          if [ -z "$ANALYTICS_URL" ]; then
            ANALYTICS_URL="$(gcloud run services describe "aklapper-api-analytics${SERVICE_SUFFIX}" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' 2>/dev/null || true)"
          fi

          echo "auth_url=${AUTH_URL}" >> "$GITHUB_OUTPUT"
          echo "analytics_url=${ANALYTICS_URL}" >> "$GITHUB_OUTPUT"

      - name: Deploy portal SSR to Cloud Run
        id: deploy-portal
        if: contains(fromJson(needs.resolve-plan.outputs.cloud_run_services_json), 'portal')
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: aklapper-portal${{ needs.resolve-plan.outputs.service_suffix }}
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/portal:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            PORTAL_MAINTENANCE_MODE=${{ vars.PORTAL_MAINTENANCE_MODE || 'false' }}
            PUBLIC_PORTAL_URL=${{ vars.PUBLIC_PORTAL_URL || 'https://andrew-k.us' }}
            PUBLIC_ANALYTICS_ENDPOINT=${{ vars.PUBLIC_ANALYTICS_ENDPOINT || '' }}
            PUBLIC_GA_MEASUREMENT_ID=${{ vars.PUBLIC_GA_MEASUREMENT_ID || '' }}
            PUBLIC_GTM_ID=${{ vars.PUBLIC_GTM_ID || '' }}
            PUBLIC_GSC_VERIFICATION=${{ vars.PUBLIC_GSC_VERIFICATION || '' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            INTERNAL_AUTH_SECRET=${{ secrets.INTERNAL_AUTH_SECRET }}
            ANALYTICS_DAILY_SALT=${{ secrets.ANALYTICS_DAILY_SALT }}
            ANALYTICS_API_URL=${{ steps.api-urls.outputs.analytics_url }}
            K8S_WATCH_URL=${{ vars.K8S_WATCH_URL || '' }}
            CADENCE_DEMO_URL=${{ vars.CADENCE_DEMO_URL || '' }}
            AI_ASK_URL=${{ vars.AI_ASK_URL || '' }}
            CONTACT_API_URL=${{ vars.CONTACT_API_URL || '' }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --min-instances=0
            --max-instances=5
            --memory=512Mi
            --cpu=1
            --cpu-throttling

      - name: Deploy admin SSR to Cloud Run
        id: deploy-admin
        if: contains(fromJson(needs.resolve-plan.outputs.cloud_run_services_json), 'admin')
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: aklapper-admin${{ needs.resolve-plan.outputs.service_suffix }}
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'aklapper' }}/admin:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            PUBLIC_ADMIN_URL=${{ vars.PUBLIC_ADMIN_URL || 'https://admin.andrew-k.us' }}
            PUBLIC_ANALYTICS_ENDPOINT=${{ vars.PUBLIC_ANALYTICS_ENDPOINT || '' }}
            PUBLIC_GA_MEASUREMENT_ID=${{ vars.PUBLIC_GA_MEASUREMENT_ID || '' }}
            PUBLIC_GTM_ID=${{ vars.PUBLIC_GTM_ID || '' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            WEBAUTHN_RP_ID=${{ vars.WEBAUTHN_RP_ID || 'admin.andrew-k.us' }}
            WEBAUTHN_RP_NAME=${{ vars.WEBAUTHN_RP_NAME || 'andrew-k.us Admin' }}
            WEBAUTHN_ORIGIN=${{ vars.WEBAUTHN_ORIGIN || vars.PUBLIC_ADMIN_URL || 'https://admin.andrew-k.us' }}
            TOTP_ENCRYPTION_KEY=${{ secrets.TOTP_ENCRYPTION_KEY }}
            INTERNAL_AUTH_SECRET=${{ secrets.INTERNAL_AUTH_SECRET }}
            ANALYTICS_DAILY_SALT=${{ secrets.ANALYTICS_DAILY_SALT }}
            AUTH_API_URL=${{ steps.api-urls.outputs.auth_url }}
            ANALYTICS_API_URL=${{ steps.api-urls.outputs.analytics_url }}
            K8S_WATCH_URL=${{ vars.K8S_WATCH_URL || '' }}
            CADENCE_DEMO_URL=${{ vars.CADENCE_DEMO_URL || '' }}
            AI_ASK_URL=${{ vars.AI_ASK_URL || '' }}
            CADENCE_ADMIN_URL=${{ vars.CADENCE_ADMIN_URL || '' }}
            CONTACT_API_URL=${{ vars.CONTACT_API_URL || '' }}
            QDRANT_URL=${{ vars.QDRANT_URL || '' }}
          flags: >-
            ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_ADMIN == 'true' && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            --port=8080
            --min-instances=0
            --max-instances=2
            --memory=512Mi
            --cpu=1
            --cpu-throttling

      - name: Resolve deployed portal and admin URLs
        id: resolve-urls
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE_SUFFIX: ${{ needs.resolve-plan.outputs.service_suffix }}
        run: |
          PORTAL_URL="${{ steps.deploy-portal.outputs.url }}"
          if [ -z "$PORTAL_URL" ]; then
            PORTAL_URL="$(gcloud run services describe "aklapper-portal${SERVICE_SUFFIX}" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' 2>/dev/null || true)"
          fi

          ADMIN_URL="${{ steps.deploy-admin.outputs.url }}"
          if [ -z "$ADMIN_URL" ]; then
            ADMIN_URL="$(gcloud run services describe "aklapper-admin${SERVICE_SUFFIX}" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' 2>/dev/null || true)"
          fi

          echo "portal_url=${PORTAL_URL}" >> "$GITHUB_OUTPUT"
          echo "admin_url=${ADMIN_URL}" >> "$GITHUB_OUTPUT"

      - name: Write Cloud Run deployment summary
        shell: bash
        run: |
          {
            echo "### Cloud Run Deploy (${{ needs.resolve-plan.outputs.env_name }})"
            echo "- Deployed services: \`${{ needs.resolve-plan.outputs.cloud_run_services_json }}\`"
            echo "- Portal: ${{ steps.resolve-urls.outputs.portal_url }}"
            echo "- Admin: ${{ steps.resolve-urls.outputs.admin_url }}"
            echo "- Auth API: ${{ steps.api-urls.outputs.auth_url }}"
            echo "- Analytics API: ${{ steps.api-urls.outputs.analytics_url }}"
            echo "- Image tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-gke:
    name: Deploy GKE Autopilot Go services (${{ needs.resolve-plan.outputs.env_name }})
    needs:
      - resolve-plan
      - build-and-push
    if: >-
      needs.resolve-plan.outputs.deploy_gke == 'true' &&
      needs.resolve-plan.outputs.has_gke == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-plan.outputs.env_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check GKE cluster configuration
        id: gke-check
        shell: bash
        run: |
          if [ -z "${{ vars.GKE_CLUSTER_NAME }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GKE Autopilot Deploy Skipped"
              echo "Set \`GKE_CLUSTER_NAME\` in the \`${{ needs.resolve-plan.outputs.env_name }}\` environment to enable Go microservice rollout. Affected Go images (\`${{ needs.resolve-plan.outputs.gke_services_json }}\`) were built and pushed to Artifact Registry with tag \`${{ github.sha }}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: steps.gke-check.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Fetch GKE Autopilot credentials
        if: steps.gke-check.outputs.configured == 'true'
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION || vars.GCP_REGION || 'us-central1' }}

      - name: Apply base namespaces, quotas, and network policies
        if: steps.gke-check.outputs.configured == 'true'
        shell: bash
        run: |
          kubectl apply -f infra/k8s/base/namespaces.yaml
          kubectl apply -f infra/k8s/base/quotas-limits.yaml
          kubectl apply -f infra/k8s/base/network-policies.yaml

      - name: Roll out affected Go microservice deployments with immutable SHA tags
        if: steps.gke-check.outputs.configured == 'true'
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'aklapper' }}
          IMAGE_TAG: ${{ github.sha }}
          GKE_SERVICES_JSON: ${{ needs.resolve-plan.outputs.gke_services_json }}
          DEPLOY_ALL: ${{ inputs.deploy_all_services }}
        run: |
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"
          if [ "$DEPLOY_ALL" = "true" ] || [ "$(node -e 'console.log(JSON.parse(process.env.GKE_SERVICES_JSON).length)')" = "5" ]; then
            for manifest in infra/k8s/portfolio-public/deployments.yaml infra/k8s/cadence-admin/deployment.yaml; do
              sed \
                -e "s|us-central1-docker.pkg.dev/PROJECT_ID/aklapper/|${REGISTRY}/|g" \
                -e "s|:latest|:${IMAGE_TAG}|g" \
                "$manifest" | kubectl apply -f -
            done
          else
            for svc in $(node -e 'console.log(JSON.parse(process.env.GKE_SERVICES_JSON).join(" "))'); do
              if [ "$svc" = "cadence-admin" ]; then
                NS="cadence-admin"
              else
                NS="portfolio-public"
              fi
              kubectl -n "$NS" set image "deployment/${svc}" "${svc}=${REGISTRY}/${svc}:${IMAGE_TAG}"
            done
          fi

  post-deploy-e2e:
    name: Live E2E smoke (${{ matrix.engine }})
    needs:
      - resolve-plan
      - deploy-cloud-run
    if: >-
      needs.resolve-plan.outputs.run_smoke_e2e == 'true' &&
      needs.deploy-cloud-run.outputs.portal_url != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-plan.outputs.env_name }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJson(needs.resolve-plan.outputs.smoke_engines_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          restore-nx-cache: 'false'

      - name: Cache Playwright browser (${{ matrix.engine }})
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser & system dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps "${{ matrix.engine }}"
          else
            pnpm exec playwright install --with-deps "${{ matrix.engine }}"
          fi

      - name: Run live Playwright smoke against deployed portal
        env:
          PORTAL_BASE_URL: ${{ needs.deploy-cloud-run.outputs.portal_url }}
          PORTAL_MAINTENANCE_MODE: ${{ vars.PORTAL_MAINTENANCE_MODE || 'false' }}
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "chromium" ]; then
            pnpm --dir apps/portal/portal-e2e exec playwright test --project=chromium --project=mobile-chrome
          else
            pnpm --dir apps/portal/portal-e2e exec playwright test --project="${{ matrix.engine }}"
          fi

      - name: Run live Playwright smoke against deployed admin (when public)
        if: vars.CLOUD_RUN_ALLOW_UNAUTH_ADMIN == 'true' && needs.deploy-cloud-run.outputs.admin_url != ''
        env:
          ADMIN_BASE_URL: ${{ needs.deploy-cloud-run.outputs.admin_url }}
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "chromium" ]; then
            pnpm --dir apps/admin/admin-e2e exec playwright test --project=chromium --project=mobile-chrome
          else
            pnpm --dir apps/admin/admin-e2e exec playwright test --project="${{ matrix.engine }}"
          fi

      - name: Upload live smoke Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-${{ needs.resolve-plan.outputs.env_name }}-${{ matrix.engine }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            apps/portal/portal-e2e/playwright-report
            apps/portal/portal-e2e/test-results
            apps/admin/admin-e2e/playwright-report
            apps/admin/admin-e2e/test-results
