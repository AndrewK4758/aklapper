name: GCP Production Deploy

# =============================================================================
# Hybrid GCP Production Deployment Pipeline (local -> ci -> prod)
#
# Manual dispatch ONLY (`workflow_dispatch`) — CD never runs automatically on
# any push or PR so zero cloud build/deploy costs occur without explicit action.
#
# Required GitHub Environment Secrets (`production`):
#   - GCP_WORKLOAD_IDENTITY_PROVIDER : projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   - GCP_WIF_SERVICE_ACCOUNT        : <deployer-sa>@<project-id>.iam.gserviceaccount.com
#
# Required GCP Secret Manager Secrets (`production`, synced via `pnpm gh:sync-env`):
#   - DATABASE_URL                   : PostgreSQL connection string (?host=/cloudsql/<project>:<region>:<instance>)
#   - INTERNAL_AUTH_SECRET           : HMAC-SHA256 signing secret for X-Internal-Auth between BFFs and APIs
#   - TOTP_ENCRYPTION_KEY            : AES-256-GCM key material for encrypted admin TOTP secrets
#   - ANALYTICS_DAILY_SALT           : Secret salt for daily visitor IP hashing in analytics ingestion
#   - QDRANT_API_KEY (optional)      : API key when QDRANT_URL points to an authenticated Qdrant cluster
#   - ADMIN_PASSWORD (optional)      : Admin credential secret consumed only when `seed_admin=true`
#   - AGENSI_API_KEY (optional)      : API key when Agensi storefront upstream requires key auth
#
# Required GitHub Environment Variables (`production`):
#   - GCP_PROJECT_ID                 : Target GCP project ID (games-424800)
#   - GCP_REGION                     : Artifact Registry / Cloud Run region (us-central1)
#   - GAR_REPOSITORY                 : Artifact Registry Docker repo name (portfolio)
#
# Optional Environment Variables (`production`):
#   - GCP_CLOUDRUN_SERVICE_ACCOUNT   : Dedicated runtime SA for Cloud Run SSR/API services
#   - GCP_MIGRATOR_SERVICE_ACCOUNT   : Dedicated migration job SA for `aklapper-db-migrate`
#   - GCP_GKE_WORKLOAD_SA            : Dedicated Workload Identity SA for GKE Go pods
#   - CLOUD_SQL_INSTANCE             : Cloud SQL connection name (e.g. games-424800:us-central1:aklapper)
#   - GKE_CLUSTER_NAME               : GKE Autopilot cluster name (GKE rollout skipped cleanly if unset)
#   - GKE_CLUSTER_LOCATION           : GKE cluster region/zone (defaults to GCP_REGION)
#   - AI_PROVIDER                    : 'vertex' | 'local' (default: 'vertex')
#   - GCP_LOCATION                   : Vertex AI location (defaults to GCP_REGION)
#   - VERTEX_MODEL                   : Vertex AI generation model ID
#   - VERTEX_EMBED_MODEL             : Vertex AI embedding model ID
#   - ADMIN_HANDLE                   : Target admin handle when running `seed_admin=true` (default: 'admin')
#   - AGENSI_API_BASE_URL            : https://www.agensi.io
#   - AGENSI_API_PATH                : /creators/aklapper
#   - AGENSI_CREATOR_HANDLE          : aklapper
#   - AGENSI_SYNC_DISABLED           : 'true' | 'false' (optional, default: 'false')
#   - AGENSI_CACHE_TTL_SECONDS       : 300
#   - AGENSI_FETCH_TIMEOUT_MS        : 1800
#   - PORTAL_MAINTENANCE_MODE        : 'true' | 'false' (default: 'false')
#   - PUBLIC_PORTAL_URL              : https://andrew-k.us
#   - PUBLIC_ADMIN_URL               : https://admin.andrew-k.us
#   - WEBAUTHN_RP_ID                 : admin.andrew-k.us
#   - WEBAUTHN_RP_NAME               : andrew-k.us Admin
#   - WEBAUTHN_ORIGIN                : https://admin.andrew-k.us
#   - AUTH_API_URL                   : https://auth.bgdkapis.us (used when CLOUD_RUN_ALLOW_UNAUTH_APIS=true)
#   - ANALYTICS_API_URL              : https://analytics.bgdkapis.us (used when CLOUD_RUN_ALLOW_UNAUTH_APIS=true)
#   - AI_ASK_URL                     : https://ask.bgdkapis.us
#   - CADENCE_DEMO_URL               : https://cadence.bgdkapis.us
#   - CADENCE_ADMIN_URL              : https://cadence-admin.bgdkapis.us
#   - K8S_WATCH_URL                  : https://k8s-watch.bgdkapis.us
#   - CONTACT_API_URL                : https://contact.bgdkapis.us
#   - QDRANT_URL                     : https://qdrant.bgdkapis.us (or managed Qdrant Cloud URL)
#   - CLOUD_RUN_ALLOW_UNAUTH_ADMIN   : 'true' | 'false' (default: 'false')
#   - CLOUD_RUN_ALLOW_UNAUTH_APIS    : 'true' | 'false' (default: 'false')
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      deploy_all_services:
        description: Build & deploy all 9 services (unchecked = only Nx affected services since base_ref)
        type: boolean
        default: false
      base_ref:
        description: Base git ref/SHA for Nx affected deploy diff (defaults to HEAD~1)
        type: string
        default: HEAD~1
      skip_ci_gate:
        description: Skip pre-deploy CI gate (use only when CI already passed for this exact SHA)
        type: boolean
        default: false
      migrate_db:
        description: Run Cloud Run Job (aklapper-db-migrate) before deploying services
        type: boolean
        default: true
      seed_admin:
        description: Seed or rotate ADMIN_HANDLE password using Secret Manager ADMIN_PASSWORD during migrate-db
        type: boolean
        default: false
      seed_content:
        description: Bootstrap missing initial CMS/terminal seed content without deleting existing rows
        type: boolean
        default: false
      deploy_cloud_run:
        description: Deploy affected SSR web apps and Node APIs to Cloud Run
        type: boolean
        default: true
      deploy_gke:
        description: Apply manifests and roll out affected Go services to GKE Autopilot
        type: boolean
        default: false
      run_smoke_e2e:
        description: Run post-deploy Playwright E2E smoke suite against live production URLs
        type: boolean
        default: true
      smoke_all_browsers:
        description: Run live smoke across chromium, firefox, and webkit (unchecked = chromium + mobile-chrome only)
        type: boolean
        default: false

concurrency:
  group: cd-gcp-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  PNPM_VERSION: 12.23.0
  NODE_VERSION: 26.13.1
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  resolve-plan:
    name: Resolve affected production services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_cloud_run: ${{ steps.resolve.outputs.deploy_cloud_run }}
      deploy_gke: ${{ steps.resolve.outputs.deploy_gke }}
      migrate_db: ${{ steps.resolve.outputs.migrate_db }}
      seed_admin: ${{ steps.resolve.outputs.seed_admin }}
      seed_content: ${{ steps.resolve.outputs.seed_content }}
      run_smoke_e2e: ${{ steps.resolve.outputs.run_smoke_e2e }}
      smoke_engines_json: ${{ steps.resolve.outputs.smoke_engines_json }}
      has_docker: ${{ steps.plan.outputs.has_docker }}
      has_admin_or_db_migration: ${{ steps.plan.outputs.has_admin_or_db_migration }}
      has_cloud_run: ${{ steps.plan.outputs.has_cloud_run }}
      has_gke: ${{ steps.plan.outputs.has_gke }}
      docker_matrix_json: ${{ steps.plan.outputs.docker_matrix_json }}
      cloud_run_services_json: ${{ steps.plan.outputs.cloud_run_services_json }}
      gke_services_json: ${{ steps.plan.outputs.gke_services_json }}

    steps:
      - name: Checkout full history for Nx affected
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          restore-nx-cache: 'false'

      - name: Resolve deploy flags and smoke matrix
        id: resolve
        shell: bash
        env:
          INPUT_DEPLOY_CLOUD_RUN: ${{ inputs.deploy_cloud_run }}
          INPUT_DEPLOY_GKE: ${{ inputs.deploy_gke }}
          INPUT_MIGRATE_DB: ${{ inputs.migrate_db }}
          INPUT_SEED_ADMIN: ${{ inputs.seed_admin }}
          INPUT_SEED_CONTENT: ${{ inputs.seed_content }}
          INPUT_RUN_SMOKE_E2E: ${{ inputs.run_smoke_e2e }}
          INPUT_SMOKE_ALL_BROWSERS: ${{ inputs.smoke_all_browsers }}
        run: |
          if [ "$INPUT_SMOKE_ALL_BROWSERS" = "true" ]; then
            SMOKE_ENGINES='["chromium","firefox","webkit"]'
          else
            SMOKE_ENGINES='["chromium"]'
          fi

          echo "deploy_cloud_run=${INPUT_DEPLOY_CLOUD_RUN}" >> "$GITHUB_OUTPUT"
          echo "deploy_gke=${INPUT_DEPLOY_GKE}" >> "$GITHUB_OUTPUT"
          echo "migrate_db=${INPUT_MIGRATE_DB}" >> "$GITHUB_OUTPUT"
          echo "seed_admin=${INPUT_SEED_ADMIN}" >> "$GITHUB_OUTPUT"
          echo "seed_content=${INPUT_SEED_CONTENT}" >> "$GITHUB_OUTPUT"
          echo "run_smoke_e2e=${INPUT_RUN_SMOKE_E2E}" >> "$GITHUB_OUTPUT"
          echo "smoke_engines_json=${SMOKE_ENGINES}" >> "$GITHUB_OUTPUT"

      - name: Compute affected deploy services
        id: plan
        shell: bash
        env:
          INPUT_DEPLOY_ALL: ${{ inputs.deploy_all_services }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_MIGRATE_DB: ${{ inputs.migrate_db }}
        run: |
          if [ "$INPUT_DEPLOY_ALL" = "true" ]; then
            node --conditions=@aklapper/source packages/tooling/src/ci-plan.ts --all "--migrate-db=${INPUT_MIGRATE_DB}"
          else
            node --conditions=@aklapper/source packages/tooling/src/ci-plan.ts --base="$INPUT_BASE_REF" --head=HEAD "--migrate-db=${INPUT_MIGRATE_DB}"
          fi

  ci-gate:
    name: Pre-deploy CI & Playwright E2E gate
    if: inputs.skip_ci_gate != true
    uses: ./.github/workflows/ci.yml
    with:
      run_all: ${{ inputs.deploy_all_services }}
      base_ref: ${{ inputs.base_ref }}
    secrets: inherit

  build-and-push:
    name: Build & push (${{ matrix.service }})
    needs:
      - resolve-plan
      - ci-gate
    if: >-
      always() &&
      needs.resolve-plan.result == 'success' &&
      (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') &&
      needs.resolve-plan.outputs.has_docker == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-plan.outputs.docker_matrix_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate GCP deployment variables
        shell: bash
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "::error::Missing required GitHub variable GCP_PROJECT_ID for environment production."
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'portfolio' }}/${{ matrix.service }}:${{ github.sha }}
            ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'portfolio' }}/${{ matrix.service }}:production-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  migrate-db:
    name: Run Drizzle migrations & optional seed (production)
    needs:
      - resolve-plan
      - ci-gate
      - build-and-push
    if: >-
      always() &&
      needs.resolve-plan.result == 'success' &&
      (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      needs.resolve-plan.outputs.migrate_db == 'true' &&
      (
        (needs.resolve-plan.outputs.deploy_cloud_run == 'true' && needs.resolve-plan.outputs.has_cloud_run == 'true') ||
        (needs.resolve-plan.outputs.deploy_gke == 'true' && needs.resolve-plan.outputs.has_gke == 'true') ||
        needs.resolve-plan.outputs.has_admin_or_db_migration == 'true' ||
        needs.resolve-plan.outputs.seed_admin == 'true' ||
        needs.resolve-plan.outputs.seed_content == 'true'
      )
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Validate GCP deployment variables
        shell: bash
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "::error::Missing required GitHub variable GCP_PROJECT_ID for environment production."
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Execute Cloud Run Job aklapper-db-migrate
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'portfolio' }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE || '' }}
          MIGRATOR_SA: ${{ vars.GCP_MIGRATOR_SERVICE_ACCOUNT || secrets.GCP_WIF_SERVICE_ACCOUNT }}
          HAS_ADMIN_IMAGE: ${{ needs.resolve-plan.outputs.has_admin_or_db_migration }}
          SEED_ADMIN: ${{ needs.resolve-plan.outputs.seed_admin }}
          SEED_CONTENT: ${{ needs.resolve-plan.outputs.seed_content }}
          ADMIN_HANDLE: ${{ vars.ADMIN_HANDLE || 'admin' }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_TAG="production-latest"
          if [ "$HAS_ADMIN_IMAGE" = "true" ]; then
            IMAGE_TAG="$IMAGE_SHA"
          fi
          ADMIN_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/admin:${IMAGE_TAG}"

          CLOUDSQL_FLAGS=()
          if [ -n "$CLOUD_SQL_INSTANCE" ]; then
            CLOUDSQL_FLAGS=(--set-cloudsql-instances="$CLOUD_SQL_INSTANCE")
          else
            CLOUDSQL_FLAGS=(--clear-cloudsql-instances)
          fi

          deploy_base_migrate_job() {
            gcloud run jobs deploy aklapper-db-migrate \
              --quiet \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --image="$ADMIN_IMAGE" \
              --service-account="$MIGRATOR_SA" \
              --command=node \
              --args="node_modules/@aklapper/db/dist/migrate.js" \
              --tasks=1 \
              --max-retries=0 \
              --task-timeout=5m \
              --set-env-vars="NODE_ENV=production" \
              --set-secrets="DATABASE_URL=DATABASE_URL:latest" \
              "${CLOUDSQL_FLAGS[@]}"
          }

          restore_default_on_exit=false
          cleanup_job_spec() {
            if [ "$restore_default_on_exit" = "true" ]; then
              deploy_base_migrate_job >/dev/null || true
            fi
          }
          trap cleanup_job_spec EXIT

          deploy_base_migrate_job
          gcloud run jobs execute aklapper-db-migrate --quiet --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --wait

          if [ "$SEED_CONTENT" = "true" ]; then
            restore_default_on_exit=true
            gcloud run jobs deploy aklapper-db-migrate \
              --quiet \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --image="$ADMIN_IMAGE" \
              --service-account="$MIGRATOR_SA" \
              --command=node \
              --args="node_modules/@aklapper/db/dist/seed.js,--mode=bootstrap" \
              --tasks=1 \
              --max-retries=0 \
              --task-timeout=5m \
              --set-env-vars="NODE_ENV=production" \
              --set-secrets="DATABASE_URL=DATABASE_URL:latest" \
              "${CLOUDSQL_FLAGS[@]}"
            gcloud run jobs execute aklapper-db-migrate --quiet --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --wait
          fi

          if [ "$SEED_ADMIN" = "true" ]; then
            if ! gcloud secrets versions describe latest --secret="ADMIN_PASSWORD" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              echo "::error::Missing enabled Secret Manager version ADMIN_PASSWORD in project ${GCP_PROJECT_ID}; cannot execute seed_admin."
              exit 1
            fi
            restore_default_on_exit=true
            gcloud run jobs deploy aklapper-db-migrate \
              --quiet \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --image="$ADMIN_IMAGE" \
              --service-account="$MIGRATOR_SA" \
              --command=node \
              --args="node_modules/@aklapper/db/dist/seed-admin.js" \
              --tasks=1 \
              --max-retries=0 \
              --task-timeout=5m \
              --set-env-vars="NODE_ENV=production,ADMIN_HANDLE=${ADMIN_HANDLE}" \
              --set-secrets="DATABASE_URL=DATABASE_URL:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest" \
              "${CLOUDSQL_FLAGS[@]}"
            gcloud run jobs execute aklapper-db-migrate --quiet --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --wait
          fi

  deploy-cloud-run:
    name: Deploy Cloud Run (production)
    needs:
      - resolve-plan
      - ci-gate
      - build-and-push
      - migrate-db
    if: >-
      always() &&
      needs.resolve-plan.result == 'success' &&
      (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.migrate-db.result == 'success' || needs.migrate-db.result == 'skipped') &&
      needs.resolve-plan.outputs.deploy_cloud_run == 'true' &&
      needs.resolve-plan.outputs.has_cloud_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      portal_url: ${{ steps.resolve-urls.outputs.portal_url }}
      admin_url: ${{ steps.resolve-urls.outputs.admin_url }}
      portal_service_url: ${{ steps.resolve-urls.outputs.portal_service_url }}
      admin_service_url: ${{ steps.resolve-urls.outputs.admin_service_url }}
      auth_service_url: ${{ steps.api-urls.outputs.auth_service_url }}
      analytics_service_url: ${{ steps.api-urls.outputs.analytics_service_url }}

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta

      - name: Deploy node-api-auth to Cloud Run
        id: deploy-api-auth
        if: contains(fromJson(needs.resolve-plan.outputs.cloud_run_services_json), 'node-api-auth')
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: node-api-auth
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'portfolio' }}/node-api-auth:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            WEBAUTHN_RP_ID=${{ vars.WEBAUTHN_RP_ID || 'admin.andrew-k.us' }}
            WEBAUTHN_RP_NAME=${{ vars.WEBAUTHN_RP_NAME || 'andrew-k.us Admin' }}
            WEBAUTHN_ORIGIN=${{ vars.WEBAUTHN_ORIGIN || vars.PUBLIC_ADMIN_URL || 'https://admin.andrew-k.us' }}
          flags: >-
            ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_APIS == 'true' && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            ${{ vars.CLOUD_SQL_INSTANCE != '' && format('--add-cloudsql-instances={0}', vars.CLOUD_SQL_INSTANCE) || '' }}
            --service-account=${{ vars.GCP_CLOUDRUN_SERVICE_ACCOUNT || secrets.GCP_WIF_SERVICE_ACCOUNT }}
            --remove-env-vars=DATABASE_URL,TOTP_ENCRYPTION_KEY,INTERNAL_AUTH_SECRET
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,TOTP_ENCRYPTION_KEY=TOTP_ENCRYPTION_KEY:latest,INTERNAL_AUTH_SECRET=INTERNAL_AUTH_SECRET:latest
            --port=8080
            --min-instances=0
            --max-instances=3
            --memory=256Mi
            --cpu=1
            --cpu-throttling

      - name: Deploy node-api-analytics to Cloud Run
        id: deploy-api-analytics
        if: contains(fromJson(needs.resolve-plan.outputs.cloud_run_services_json), 'node-api-analytics')
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: node-api-analytics
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'portfolio' }}/node-api-analytics:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
          flags: >-
            ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_APIS == 'true' && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            ${{ vars.CLOUD_SQL_INSTANCE != '' && format('--add-cloudsql-instances={0}', vars.CLOUD_SQL_INSTANCE) || '' }}
            --service-account=${{ vars.GCP_CLOUDRUN_SERVICE_ACCOUNT || secrets.GCP_WIF_SERVICE_ACCOUNT }}
            --remove-env-vars=DATABASE_URL,ANALYTICS_DAILY_SALT,INTERNAL_AUTH_SECRET
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,ANALYTICS_DAILY_SALT=ANALYTICS_DAILY_SALT:latest,INTERNAL_AUTH_SECRET=INTERNAL_AUTH_SECRET:latest
            --port=8080
            --min-instances=0
            --max-instances=3
            --memory=256Mi
            --cpu=1
            --cpu-throttling

      - name: Resolve live Cloud Run API URLs for SSR apps
        id: api-urls
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          ALLOW_UNAUTH_APIS: ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_APIS || 'false' }}
          CUSTOM_AUTH_URL: ${{ vars.AUTH_API_URL || '' }}
          CUSTOM_ANALYTICS_URL: ${{ vars.ANALYTICS_API_URL || '' }}
        run: |
          AUTH_SERVICE_URL="${{ steps.deploy-api-auth.outputs.url }}"
          if [ -z "$AUTH_SERVICE_URL" ]; then
            AUTH_SERVICE_URL="$(gcloud run services describe "node-api-auth" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' 2>/dev/null || true)"
          fi

          ANALYTICS_SERVICE_URL="${{ steps.deploy-api-analytics.outputs.url }}"
          if [ -z "$ANALYTICS_SERVICE_URL" ]; then
            ANALYTICS_SERVICE_URL="$(gcloud run services describe "node-api-analytics" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' 2>/dev/null || true)"
          fi

          if [ "$ALLOW_UNAUTH_APIS" = "true" ] && [ -n "$CUSTOM_AUTH_URL" ]; then
            AUTH_URL="$CUSTOM_AUTH_URL"
          else
            AUTH_URL="$AUTH_SERVICE_URL"
          fi

          if [ "$ALLOW_UNAUTH_APIS" = "true" ] && [ -n "$CUSTOM_ANALYTICS_URL" ]; then
            ANALYTICS_URL="$CUSTOM_ANALYTICS_URL"
          else
            ANALYTICS_URL="$ANALYTICS_SERVICE_URL"
          fi

          HAS_AGENSI_API_KEY="false"
          if gcloud secrets versions describe latest --secret="AGENSI_API_KEY" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            HAS_AGENSI_API_KEY="true"
          fi

          HAS_DOSSIER_PRIVACY_DENYLIST="false"
          if gcloud secrets versions describe latest --secret="DOSSIER_PRIVACY_DENYLIST" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            HAS_DOSSIER_PRIVACY_DENYLIST="true"
          fi

          echo "auth_url=${AUTH_URL}" >> "$GITHUB_OUTPUT"
          echo "analytics_url=${ANALYTICS_URL}" >> "$GITHUB_OUTPUT"
          echo "auth_service_url=${AUTH_SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "analytics_service_url=${ANALYTICS_SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "has_agensi_api_key=${HAS_AGENSI_API_KEY}" >> "$GITHUB_OUTPUT"
          echo "has_dossier_privacy_denylist=${HAS_DOSSIER_PRIVACY_DENYLIST}" >> "$GITHUB_OUTPUT"

      - name: Deploy portal SSR to Cloud Run
        id: deploy-portal
        if: contains(fromJson(needs.resolve-plan.outputs.cloud_run_services_json), 'portal')
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: portal
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'portfolio' }}/portal:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            PORTAL_MAINTENANCE_MODE=${{ vars.PORTAL_MAINTENANCE_MODE || 'false' }}
            PUBLIC_PORTAL_URL=${{ vars.PUBLIC_PORTAL_URL || 'https://andrew-k.us' }}
            PUBLIC_ANALYTICS_ENDPOINT=${{ vars.PUBLIC_ANALYTICS_ENDPOINT || '' }}
            PUBLIC_GA_MEASUREMENT_ID=${{ vars.PUBLIC_GA_MEASUREMENT_ID || '' }}
            PUBLIC_GTM_ID=${{ vars.PUBLIC_GTM_ID || '' }}
            PUBLIC_GSC_VERIFICATION=${{ vars.PUBLIC_GSC_VERIFICATION || '' }}
            AI_PROVIDER=${{ vars.AI_PROVIDER || 'vertex' }}
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_LOCATION=${{ vars.GCP_LOCATION || vars.GCP_REGION || 'us-central1' }}
            VERTEX_MODEL=${{ vars.VERTEX_MODEL || '' }}
            VERTEX_EMBED_MODEL=${{ vars.VERTEX_EMBED_MODEL || '' }}
            ANALYTICS_API_URL=${{ steps.api-urls.outputs.analytics_url }}
            K8S_WATCH_URL=${{ vars.K8S_WATCH_URL || '' }}
            CADENCE_DEMO_URL=${{ vars.CADENCE_DEMO_URL || '' }}
            AI_ASK_URL=${{ vars.AI_ASK_URL || '' }}
            CONTACT_API_URL=${{ vars.CONTACT_API_URL || '' }}
            AGENSI_API_BASE_URL=${{ vars.AGENSI_API_BASE_URL || 'https://www.agensi.io' }}
            AGENSI_API_PATH=${{ vars.AGENSI_API_PATH || '/creators/aklapper' }}
            AGENSI_CREATOR_HANDLE=${{ vars.AGENSI_CREATOR_HANDLE || 'aklapper' }}
            AGENSI_SYNC_DISABLED=${{ vars.AGENSI_SYNC_DISABLED || 'false' }}
            AGENSI_CACHE_TTL_SECONDS=${{ vars.AGENSI_CACHE_TTL_SECONDS || '300' }}
            AGENSI_FETCH_TIMEOUT_MS=${{ vars.AGENSI_FETCH_TIMEOUT_MS || '1800' }}
          flags: >-
            --allow-unauthenticated
            ${{ vars.CLOUD_SQL_INSTANCE != '' && format('--add-cloudsql-instances={0}', vars.CLOUD_SQL_INSTANCE) || '' }}
            --service-account=${{ vars.GCP_CLOUDRUN_SERVICE_ACCOUNT || secrets.GCP_WIF_SERVICE_ACCOUNT }}
            --remove-env-vars=DATABASE_URL,INTERNAL_AUTH_SECRET,ANALYTICS_DAILY_SALT,QDRANT_API_KEY,AGENSI_API_KEY
            ${{ steps.api-urls.outputs.has_agensi_api_key == 'true' && '--set-secrets=DATABASE_URL=DATABASE_URL:latest,INTERNAL_AUTH_SECRET=INTERNAL_AUTH_SECRET:latest,ANALYTICS_DAILY_SALT=ANALYTICS_DAILY_SALT:latest,AGENSI_API_KEY=AGENSI_API_KEY:latest' || '--set-secrets=DATABASE_URL=DATABASE_URL:latest,INTERNAL_AUTH_SECRET=INTERNAL_AUTH_SECRET:latest,ANALYTICS_DAILY_SALT=ANALYTICS_DAILY_SALT:latest' }}
            --port=8080
            --min-instances=0
            --max-instances=5
            --memory=512Mi
            --cpu=1
            --cpu-throttling

      - name: Deploy admin SSR to Cloud Run
        id: deploy-admin
        if: contains(fromJson(needs.resolve-plan.outputs.cloud_run_services_json), 'admin')
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          service: admin
          image: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'portfolio' }}/admin:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            PUBLIC_ADMIN_URL=${{ vars.PUBLIC_ADMIN_URL || 'https://admin.andrew-k.us' }}
            PUBLIC_ANALYTICS_ENDPOINT=${{ vars.PUBLIC_ANALYTICS_ENDPOINT || '' }}
            PUBLIC_GA_MEASUREMENT_ID=${{ vars.PUBLIC_GA_MEASUREMENT_ID || '' }}
            PUBLIC_GTM_ID=${{ vars.PUBLIC_GTM_ID || '' }}
            WEBAUTHN_RP_ID=${{ vars.WEBAUTHN_RP_ID || 'admin.andrew-k.us' }}
            WEBAUTHN_RP_NAME=${{ vars.WEBAUTHN_RP_NAME || 'andrew-k.us Admin' }}
            WEBAUTHN_ORIGIN=${{ vars.WEBAUTHN_ORIGIN || vars.PUBLIC_ADMIN_URL || 'https://admin.andrew-k.us' }}
            AI_PROVIDER=${{ vars.AI_PROVIDER || 'vertex' }}
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_LOCATION=${{ vars.GCP_LOCATION || vars.GCP_REGION || 'us-central1' }}
            VERTEX_MODEL=${{ vars.VERTEX_MODEL || '' }}
            VERTEX_EMBED_MODEL=${{ vars.VERTEX_EMBED_MODEL || '' }}
            AUTH_API_URL=${{ steps.api-urls.outputs.auth_url }}
            ANALYTICS_API_URL=${{ steps.api-urls.outputs.analytics_url }}
            K8S_WATCH_URL=${{ vars.K8S_WATCH_URL || '' }}
            CADENCE_DEMO_URL=${{ vars.CADENCE_DEMO_URL || '' }}
            AI_ASK_URL=${{ vars.AI_ASK_URL || '' }}
            CADENCE_ADMIN_URL=${{ vars.CADENCE_ADMIN_URL || '' }}
            CONTACT_API_URL=${{ vars.CONTACT_API_URL || '' }}
            QDRANT_URL=${{ vars.QDRANT_URL || '' }}
            AGENSI_API_BASE_URL=${{ vars.AGENSI_API_BASE_URL || 'https://www.agensi.io' }}
            AGENSI_API_PATH=${{ vars.AGENSI_API_PATH || '/creators/aklapper' }}
            AGENSI_CREATOR_HANDLE=${{ vars.AGENSI_CREATOR_HANDLE || 'aklapper' }}
            AGENSI_SYNC_DISABLED=${{ vars.AGENSI_SYNC_DISABLED || 'false' }}
            AGENSI_CACHE_TTL_SECONDS=${{ vars.AGENSI_CACHE_TTL_SECONDS || '300' }}
            AGENSI_FETCH_TIMEOUT_MS=${{ vars.AGENSI_FETCH_TIMEOUT_MS || '1800' }}
          flags: >-
            ${{ vars.CLOUD_RUN_ALLOW_UNAUTH_ADMIN == 'true' && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            ${{ vars.CLOUD_SQL_INSTANCE != '' && format('--add-cloudsql-instances={0}', vars.CLOUD_SQL_INSTANCE) || '' }}
            --service-account=${{ vars.GCP_CLOUDRUN_SERVICE_ACCOUNT || secrets.GCP_WIF_SERVICE_ACCOUNT }}
            --remove-env-vars=DATABASE_URL,TOTP_ENCRYPTION_KEY,INTERNAL_AUTH_SECRET,ANALYTICS_DAILY_SALT,QDRANT_API_KEY,AGENSI_API_KEY,DOSSIER_PRIVACY_DENYLIST
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,TOTP_ENCRYPTION_KEY=TOTP_ENCRYPTION_KEY:latest,INTERNAL_AUTH_SECRET=INTERNAL_AUTH_SECRET:latest,ANALYTICS_DAILY_SALT=ANALYTICS_DAILY_SALT:latest${{ vars.QDRANT_URL != '' && ',QDRANT_API_KEY=QDRANT_API_KEY:latest' || '' }}${{ steps.api-urls.outputs.has_agensi_api_key == 'true' && ',AGENSI_API_KEY=AGENSI_API_KEY:latest' || '' }}${{ steps.api-urls.outputs.has_dossier_privacy_denylist == 'true' && ',DOSSIER_PRIVACY_DENYLIST=DOSSIER_PRIVACY_DENYLIST:latest' || '' }}
            --port=8080
            --min-instances=0
            --max-instances=2
            --memory=512Mi
            --cpu=1
            --cpu-throttling

      - name: Ensure custom domain mappings for deployed Cloud Run services
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          CLOUD_RUN_SERVICES_JSON: ${{ needs.resolve-plan.outputs.cloud_run_services_json }}
          ADMIN_URL: ${{ vars.PUBLIC_ADMIN_URL || 'https://admin.andrew-k.us' }}
          AUTH_URL: ${{ vars.AUTH_API_URL || 'https://auth.bgdkapis.us' }}
          ANALYTICS_URL: ${{ vars.ANALYTICS_API_URL || 'https://analytics.bgdkapis.us' }}
        run: |
          ensure_mapping() {
            local service="$1"
            local url="$2"
            local domain="${url#https://}"
            domain="${domain#http://}"
            domain="${domain%%/*}"
            if [ -z "$domain" ] || [[ "$domain" == *.run.app ]]; then
              return 0
            fi
            if gcloud beta run domain-mappings describe --quiet --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --domain="$domain" >/dev/null 2>&1; then
              echo "✓ Domain mapping already exists: ${domain} -> ${service}"
            else
              gcloud beta run domain-mappings create --quiet --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --service="$service" --domain="$domain"
            fi
          }

          for svc in $(node -e 'console.log(JSON.parse(process.env.CLOUD_RUN_SERVICES_JSON).join(" "))'); do
            case "$svc" in
              admin) ensure_mapping "admin" "$ADMIN_URL" ;;
              node-api-auth) ensure_mapping "node-api-auth" "$AUTH_URL" ;;
              node-api-analytics) ensure_mapping "node-api-analytics" "$ANALYTICS_URL" ;;
            esac
          done

      - name: Resolve deployed portal and admin URLs
        id: resolve-urls
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          PORTAL_SERVICE_URL="${{ steps.deploy-portal.outputs.url }}"
          if [ -z "$PORTAL_SERVICE_URL" ]; then
            PORTAL_SERVICE_URL="$(gcloud run services describe "portal" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' 2>/dev/null || true)"
          fi

          ADMIN_SERVICE_URL="${{ steps.deploy-admin.outputs.url }}"
          if [ -z "$ADMIN_SERVICE_URL" ]; then
            ADMIN_SERVICE_URL="$(gcloud run services describe "admin" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' 2>/dev/null || true)"
          fi

          PORTAL_URL="${{ vars.PUBLIC_PORTAL_URL || '' }}"
          if [ -z "$PORTAL_URL" ]; then
            PORTAL_URL="$PORTAL_SERVICE_URL"
          fi

          ADMIN_URL="${{ vars.PUBLIC_ADMIN_URL || '' }}"
          if [ -z "$ADMIN_URL" ]; then
            ADMIN_URL="$ADMIN_SERVICE_URL"
          fi

          echo "portal_url=${PORTAL_URL}" >> "$GITHUB_OUTPUT"
          echo "admin_url=${ADMIN_URL}" >> "$GITHUB_OUTPUT"
          echo "portal_service_url=${PORTAL_SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "admin_service_url=${ADMIN_SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Write Cloud Run deployment summary
        shell: bash
        run: |
          {
            echo "### Cloud Run Deploy (production)"
            echo "- Deployed services: \`${{ needs.resolve-plan.outputs.cloud_run_services_json }}\`"
            echo "- Portal (public): ${{ steps.resolve-urls.outputs.portal_url }}"
            echo "- Portal (service): ${{ steps.resolve-urls.outputs.portal_service_url }}"
            echo "- Admin (public): ${{ steps.resolve-urls.outputs.admin_url }}"
            echo "- Admin (service): ${{ steps.resolve-urls.outputs.admin_service_url }}"
            echo "- Auth API (service): ${{ steps.api-urls.outputs.auth_service_url }}"
            echo "- Analytics API (service): ${{ steps.api-urls.outputs.analytics_service_url }}"
            echo "- Image tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-gke:
    name: Deploy GKE Autopilot Go services (production)
    needs:
      - resolve-plan
      - ci-gate
      - build-and-push
      - migrate-db
    if: >-
      always() &&
      needs.resolve-plan.result == 'success' &&
      (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.migrate-db.result == 'success' || needs.migrate-db.result == 'skipped') &&
      needs.resolve-plan.outputs.deploy_gke == 'true' &&
      needs.resolve-plan.outputs.has_gke == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check GKE cluster configuration
        id: gke-check
        shell: bash
        run: |
          if [ -z "${{ vars.GKE_CLUSTER_NAME }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GKE Autopilot Deploy Skipped"
              echo "Set \`GKE_CLUSTER_NAME\` in the \`production\` environment to enable Go microservice rollout. Affected Go images (\`${{ needs.resolve-plan.outputs.gke_services_json }}\`) were built and pushed to Artifact Registry with tag \`${{ github.sha }}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
              echo "::error::Missing required GitHub variable GCP_PROJECT_ID for GKE deployment."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup workspace
        if: steps.gke-check.outputs.configured == 'true'
        uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          restore-nx-cache: 'false'

      - name: Authenticate to Google Cloud (WIF)
        if: steps.gke-check.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        if: steps.gke-check.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Fetch GKE Autopilot credentials
        if: steps.gke-check.outputs.configured == 'true'
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION || vars.GCP_REGION || 'us-central1' }}

      - name: Ensure namespaces and materialize runtime ConfigMaps & Secrets
        if: steps.gke-check.outputs.configured == 'true'
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'vertex' }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION || vars.GCP_REGION || 'us-central1' }}
          VERTEX_MODEL: ${{ vars.VERTEX_MODEL || '' }}
          VERTEX_THINKING_BUDGET: ${{ vars.VERTEX_THINKING_BUDGET || '0' }}
          VERTEX_EMBED_MODEL: ${{ vars.VERTEX_EMBED_MODEL || '' }}
          QDRANT_URL: ${{ vars.QDRANT_URL || '' }}
          AGENSI_CREATOR_HANDLE: ${{ vars.AGENSI_CREATOR_HANDLE || 'aklapper' }}
        run: |
          set -euo pipefail
          kubectl apply -f infra/k8s/base/namespaces.yaml

          tmp_secrets_dir="$(mktemp -d)"
          chmod 700 "$tmp_secrets_dir"
          trap 'rm -rf "$tmp_secrets_dir"' EXIT

          for secret_id in DATABASE_URL INTERNAL_AUTH_SECRET; do
            gcloud secrets versions access latest --secret="$secret_id" --project="$GCP_PROJECT_ID" > "${tmp_secrets_dir}/${secret_id}"
            chmod 600 "${tmp_secrets_dir}/${secret_id}"
          done
          if [ -n "$QDRANT_URL" ]; then
            gcloud secrets versions access latest --secret="QDRANT_API_KEY" --project="$GCP_PROJECT_ID" > "${tmp_secrets_dir}/QDRANT_API_KEY"
            chmod 600 "${tmp_secrets_dir}/QDRANT_API_KEY"
          fi
          if gcloud secrets versions describe latest --secret="AI_PRIVACY_DENYLIST" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets versions access latest --secret="AI_PRIVACY_DENYLIST" --project="$GCP_PROJECT_ID" > "${tmp_secrets_dir}/AI_PRIVACY_DENYLIST"
            chmod 600 "${tmp_secrets_dir}/AI_PRIVACY_DENYLIST"
          fi
          if gcloud secrets versions describe latest --secret="DOSSIER_PRIVACY_DENYLIST" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets versions access latest --secret="DOSSIER_PRIVACY_DENYLIST" --project="$GCP_PROJECT_ID" > "${tmp_secrets_dir}/DOSSIER_PRIVACY_DENYLIST"
            chmod 600 "${tmp_secrets_dir}/DOSSIER_PRIVACY_DENYLIST"
          fi

          kubectl create configmap aklapper-runtime-config \
            -n portfolio-public \
            --from-literal="APP_ENV=production" \
            --from-literal="AI_PROVIDER=${AI_PROVIDER}" \
            --from-literal="GCP_PROJECT_ID=${GCP_PROJECT_ID}" \
            --from-literal="GCP_LOCATION=${GCP_LOCATION}" \
            --from-literal="VERTEX_MODEL=${VERTEX_MODEL}" \
            --from-literal="VERTEX_THINKING_BUDGET=${VERTEX_THINKING_BUDGET}" \
            --from-literal="VERTEX_EMBED_MODEL=${VERTEX_EMBED_MODEL}" \
            --from-literal="QDRANT_URL=${QDRANT_URL}" \
            --from-literal="AGENSI_CREATOR_HANDLE=${AGENSI_CREATOR_HANDLE}" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null

          kubectl create configmap aklapper-runtime-config \
            -n cadence-admin \
            --from-literal="APP_ENV=production" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null

          public_secret_args=(
            --from-file="DATABASE_URL=${tmp_secrets_dir}/DATABASE_URL"
            --from-file="INTERNAL_AUTH_SECRET=${tmp_secrets_dir}/INTERNAL_AUTH_SECRET"
          )
          if [ -s "${tmp_secrets_dir}/QDRANT_API_KEY" ]; then
            public_secret_args+=(--from-file="QDRANT_API_KEY=${tmp_secrets_dir}/QDRANT_API_KEY")
          fi
          if [ -s "${tmp_secrets_dir}/AI_PRIVACY_DENYLIST" ]; then
            public_secret_args+=(--from-file="AI_PRIVACY_DENYLIST=${tmp_secrets_dir}/AI_PRIVACY_DENYLIST")
          fi
          if [ -s "${tmp_secrets_dir}/DOSSIER_PRIVACY_DENYLIST" ]; then
            public_secret_args+=(--from-file="DOSSIER_PRIVACY_DENYLIST=${tmp_secrets_dir}/DOSSIER_PRIVACY_DENYLIST")
          fi
          kubectl create secret generic aklapper-runtime-secrets \
            -n portfolio-public \
            "${public_secret_args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null

          kubectl create secret generic aklapper-runtime-secrets \
            -n cadence-admin \
            --from-file="DATABASE_URL=${tmp_secrets_dir}/DATABASE_URL" \
            --from-file="INTERNAL_AUTH_SECRET=${tmp_secrets_dir}/INTERNAL_AUTH_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null

      - name: Render and apply complete GKE Autopilot manifests
        if: steps.gke-check.outputs.configured == 'true'
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'portfolio' }}
          IMAGE_TAG: ${{ github.sha }}
          GCP_GKE_WORKLOAD_SA: ${{ vars.GCP_GKE_WORKLOAD_SA || '' }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE || '' }}
          GKE_SERVICES_JSON: ${{ needs.resolve-plan.outputs.gke_services_json }}
          DEPLOY_ALL: ${{ inputs.deploy_all_services }}
        run: |
          set -euo pipefail
          node --conditions=@aklapper/source packages/tooling/src/render-k8s.ts \
            --dir=infra/k8s \
            --project-id="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --gar-repository="$GAR_REPOSITORY" \
            --image-tag="$IMAGE_TAG" \
            --gke-workload-sa="$GCP_GKE_WORKLOAD_SA" \
            --cloud-sql-instance="$CLOUD_SQL_INSTANCE" \
            | kubectl apply -f -

          AFFECTED_SET=" $(node -e 'console.log(JSON.parse(process.env.GKE_SERVICES_JSON).join(" "))') "
          if [ "$DEPLOY_ALL" = "true" ] || [[ "$AFFECTED_SET" == *" ai-ask "* ]]; then
            kubectl -n portfolio-public rollout status deployment/ai-ask --timeout=180s
          fi

  post-deploy-e2e:
    name: Live E2E smoke (${{ matrix.engine }})
    needs:
      - resolve-plan
      - deploy-cloud-run
    if: >-
      needs.resolve-plan.outputs.run_smoke_e2e == 'true' &&
      needs.deploy-cloud-run.outputs.portal_url != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJson(needs.resolve-plan.outputs.smoke_engines_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify WIF-authenticated /healthz on deployed Cloud Run services
        if: matrix.engine == 'chromium'
        shell: bash
        env:
          PORTAL_SERVICE_URL: ${{ needs.deploy-cloud-run.outputs.portal_service_url }}
          ADMIN_SERVICE_URL: ${{ needs.deploy-cloud-run.outputs.admin_service_url }}
          AUTH_SERVICE_URL: ${{ needs.deploy-cloud-run.outputs.auth_service_url }}
          ANALYTICS_SERVICE_URL: ${{ needs.deploy-cloud-run.outputs.analytics_service_url }}
        run: |
          set -euo pipefail
          for entry in \
            "portal:${PORTAL_SERVICE_URL}" \
            "admin:${ADMIN_SERVICE_URL}" \
            "node-api-auth:${AUTH_SERVICE_URL}" \
            "node-api-analytics:${ANALYTICS_SERVICE_URL}"; do
            svc="${entry%%:*}"
            url="${entry#*:}"
            if [ -z "$url" ]; then
              continue
            fi
            if [[ ! "${url%/}" =~ ^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.run\.app$ ]]; then
              echo "::error::Expected canonical *.run.app URL for ${svc}, got ${url}"
              exit 1
            fi
            token="$(gcloud auth print-identity-token --audiences="${url%/}")"
            if [ -z "$token" ]; then
              echo "::error::Failed to obtain WIF OIDC identity token for ${svc}"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" "${url%/}/healthz" || echo '000')"
            unset token
            if [ "$status" != "200" ]; then
              echo "::error::Health check failed for ${svc} (${url%/}/healthz) with HTTP ${status}"
              exit 1
            fi
            echo "{\"event\":\"cd.post_deploy_smoke.verified\",\"seam\":\"DELTA_AUDIT_GAP\",\"service\":\"${svc}\",\"httpStatus\":${status}}"
          done

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          restore-nx-cache: 'false'

      - name: Cache Playwright browser (${{ matrix.engine }})
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser & system dependencies
        run: |
          if [ "${{ matrix.engine }}" = "chromium" ]; then
            if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
              pnpm exec playwright install --with-deps chrome ffmpeg
            else
              pnpm exec playwright install-deps chrome
              pnpm exec playwright install ffmpeg
            fi
          elif [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps "${{ matrix.engine }}"
          else
            pnpm exec playwright install --with-deps "${{ matrix.engine }}"
          fi

      - name: Run live Playwright @smoke suite against deployed portal
        env:
          PORTAL_BASE_URL: ${{ needs.deploy-cloud-run.outputs.portal_url }}
          PORTAL_MAINTENANCE_MODE: ${{ vars.PORTAL_MAINTENANCE_MODE || 'false' }}
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "chromium" ]; then
            pnpm --dir apps/portal/portal-e2e exec playwright test --grep @smoke --project=chromium --project=mobile-chrome
          else
            pnpm --dir apps/portal/portal-e2e exec playwright test --grep @smoke --project="${{ matrix.engine }}"
          fi

      - name: Run live Playwright @smoke suite against deployed admin (when public)
        if: vars.CLOUD_RUN_ALLOW_UNAUTH_ADMIN == 'true' && needs.deploy-cloud-run.outputs.admin_url != ''
        env:
          ADMIN_BASE_URL: ${{ needs.deploy-cloud-run.outputs.admin_url }}
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "chromium" ]; then
            pnpm --dir apps/admin/admin-e2e exec playwright test --grep @smoke --project=chromium --project=mobile-chrome
          else
            pnpm --dir apps/admin/admin-e2e exec playwright test --grep @smoke --project="${{ matrix.engine }}"
          fi

      - name: Upload live smoke Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-production-${{ matrix.engine }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            apps/portal/portal-e2e/playwright-report
            apps/portal/portal-e2e/test-results
            apps/admin/admin-e2e/playwright-report
            apps/admin/admin-e2e/test-results
