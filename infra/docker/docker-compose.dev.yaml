services:
  postgres:
    image: postgres:19-alpine
    container_name: aklapper-pg19-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aklapper}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5439}:5432'
    volumes:
      - pg19_dev_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aklapper}']
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aklapper-qdrant-dev
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      - qdrant_dev_data:/qdrant/storage
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "200 OK" <&3''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg19_dev_data:
  qdrant_dev_data:
