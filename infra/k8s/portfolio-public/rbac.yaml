apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-watch
  namespace: portfolio-public
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-watch-public-reader
  namespace: portfolio-public
rules:
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-watch-public-reader-binding
  namespace: portfolio-public
subjects:
  - kind: ServiceAccount
    name: k8s-watch
    namespace: portfolio-public
roleRef:
  kind: Role
  name: k8s-watch-public-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-ask
  namespace: portfolio-public
  annotations:
    iam.gke.io/gcp-service-account: gke-workload@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cadence-demo
  namespace: portfolio-public
  annotations:
    iam.gke.io/gcp-service-account: gke-workload@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
