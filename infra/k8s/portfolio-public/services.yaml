apiVersion: v1
kind: Service
metadata:
  name: k8s-watch
  namespace: portfolio-public
spec:
  type: ClusterIP
  selector:
    app: k8s-watch
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: cadence-demo
  namespace: portfolio-public
spec:
  type: ClusterIP
  selector:
    app: cadence-demo
  ports:
    - name: http
      port: 8082
      targetPort: 8082
    - name: grpc
      port: 9090
      targetPort: 9090
      appProtocol: kubernetes.io/h2c
---
apiVersion: v1
kind: Service
metadata:
  name: ai-ask
  namespace: portfolio-public
spec:
  type: ClusterIP
  selector:
    app: ai-ask
  ports:
    - name: http
      port: 8083
      targetPort: 8083
    - name: grpc
      port: 9090
      targetPort: 9090
      appProtocol: kubernetes.io/h2c
