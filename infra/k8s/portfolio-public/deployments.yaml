apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-ask
  namespace: portfolio-public
  annotations:
    iam.gke.io/gcp-service-account: ai-ask@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: Service
metadata:
  name: ai-ask
  namespace: portfolio-public
  labels:
    app: ai-ask
spec:
  type: ClusterIP
  selector:
    app: ai-ask
  ports:
    - name: http
      port: 80
      targetPort: 8083
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ask
  namespace: portfolio-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-ask
  template:
    metadata:
      labels:
        app: ai-ask
    spec:
      serviceAccountName: ai-ask
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-ask
          image: us-central1-docker.pkg.dev/PROJECT_ID/aklapper/ai-ask:latest
          ports:
            - containerPort: 8083
          env:
            - name: APP_ENV
              value: production
            - name: PORT
              value: '8083'
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: ai-ask-config
                  key: AI_PROVIDER
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: ai-ask-config
                  key: GCP_PROJECT_ID
            - name: GCP_LOCATION
              valueFrom:
                configMapKeyRef:
                  name: ai-ask-config
                  key: GCP_LOCATION
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-ask-config
                  key: QDRANT_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-ask-secrets
                  key: DATABASE_URL
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-ask-secrets
                  key: INTERNAL_AUTH_SECRET
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-ask-secrets
                  key: QDRANT_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
