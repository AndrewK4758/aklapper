apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-watch
  namespace: portfolio-public
spec:
  replicas: 0
  selector:
    matchLabels:
      app: k8s-watch
  template:
    metadata:
      labels:
        app: k8s-watch
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-watch
          image: us-central1-docker.pkg.dev/PROJECT_ID/aklapper/k8s-watch:latest
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
