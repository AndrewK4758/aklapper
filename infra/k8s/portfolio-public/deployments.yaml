apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-watch
  namespace: portfolio-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-watch
  template:
    metadata:
      labels:
        app: k8s-watch
    spec:
      serviceAccountName: k8s-watch
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-watch
          image: us-central1-docker.pkg.dev/PROJECT_ID/aklapper/k8s-watch:latest
          ports:
            - containerPort: 8081
          env:
            - name: APP_ENV
              value: production
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: aklapper-runtime-secrets
                  key: INTERNAL_AUTH_SECRET
          envFrom:
            - configMapRef:
                name: aklapper-runtime-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-demo
  namespace: portfolio-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadence-demo
  template:
    metadata:
      labels:
        app: cadence-demo
    spec:
      serviceAccountName: cadence-demo
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cloudsql
          emptyDir: {}
      containers:
        - name: cadence-demo
          image: us-central1-docker.pkg.dev/PROJECT_ID/aklapper/cadence-demo:latest
          ports:
            - name: http
              containerPort: 8082
            - name: grpc
              containerPort: 9090
          env:
            - name: APP_ENV
              value: production
            - name: PORT
              value: '8082'
            - name: GRPC_PORT
              value: '9090'
          envFrom:
            - configMapRef:
                name: aklapper-runtime-config
            - secretRef:
                name: aklapper-runtime-secrets
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
        # cloud-sql-proxy-start
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-proxies/cloud-sql-proxy:2.15.2
          args:
            - --unix-socket=/cloudsql
            - --structured-logs
            - PROJECT_ID:us-central1:aklapper
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
        # cloud-sql-proxy-end
---
