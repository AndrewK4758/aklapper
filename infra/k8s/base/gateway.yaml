apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aklapper-go-gateway
  namespace: portfolio-public
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8s-watch-route
  namespace: portfolio-public
spec:
  parentRefs:
    - name: aklapper-go-gateway
  hostnames:
    - k8s-watch.bgdkapis.us
  rules:
    - backendRefs:
        - name: k8s-watch
          port: 8081
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cadence-demo-route
  namespace: portfolio-public
spec:
  parentRefs:
    - name: aklapper-go-gateway
  hostnames:
    - cadence.bgdkapis.us
  rules:
    - backendRefs:
        - name: cadence-demo
          port: 8082
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-ask-route
  namespace: portfolio-public
spec:
  parentRefs:
    - name: aklapper-go-gateway
  hostnames:
    - ask.bgdkapis.us
  rules:
    - backendRefs:
        - name: ai-ask
          port: 8083
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: contact-route
  namespace: portfolio-public
spec:
  parentRefs:
    - name: aklapper-go-gateway
  hostnames:
    - contact.bgdkapis.us
  rules:
    - backendRefs:
        - name: contact
          port: 8084
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cadence-admin-route
  namespace: cadence-admin
spec:
  parentRefs:
    - name: aklapper-go-gateway
      namespace: portfolio-public
  hostnames:
    - cadence-admin.bgdkapis.us
  rules:
    - backendRefs:
        - name: cadence-admin
          port: 8085
