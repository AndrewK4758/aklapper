apiVersion: v1
kind: ResourceQuota
metadata:
  name: portfolio-public-quota
  namespace: portfolio-public
spec:
  hard:
    requests.cpu: '2'
    requests.memory: 2Gi
    limits.cpu: '4'
    limits.memory: 4Gi
    pods: '10'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: portfolio-public-limits
  namespace: portfolio-public
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 250m
        memory: 256Mi
