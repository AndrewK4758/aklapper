apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-admin
  namespace: cadence-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadence-admin
  template:
    metadata:
      labels:
        app: cadence-admin
    spec:
      serviceAccountName: cadence-admin
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cloudsql
          emptyDir: {}
      containers:
        - name: cadence-admin
          image: us-central1-docker.pkg.dev/PROJECT_ID/aklapper/cadence-admin:latest
          ports:
            - containerPort: 8085
          env:
            - name: APP_ENV
              value: production
          envFrom:
            - configMapRef:
                name: aklapper-runtime-config
            - secretRef:
                name: aklapper-runtime-secrets
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
        # cloud-sql-proxy-start
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-proxies/cloud-sql-proxy:2.15.2
          args:
            - --unix-socket=/cloudsql
            - --structured-logs
            - PROJECT_ID:us-central1:aklapper
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
        # cloud-sql-proxy-end
