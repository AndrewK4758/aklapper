apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-admin
  namespace: cadence-admin
spec:
  replicas: 0
  selector:
    matchLabels:
      app: cadence-admin
  template:
    metadata:
      labels:
        app: cadence-admin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cadence-admin
          image: us-central1-docker.pkg.dev/PROJECT_ID/aklapper/cadence-admin:latest
          ports:
            - containerPort: 8085
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
