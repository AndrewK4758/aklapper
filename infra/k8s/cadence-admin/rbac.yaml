apiVersion: v1
kind: ServiceAccount
metadata:
  name: cadence-admin
  namespace: cadence-admin
  annotations:
    iam.gke.io/gcp-service-account: gke-workload@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-watch-admin-reader
  namespace: cadence-admin
rules:
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-watch-admin-reader-binding
  namespace: cadence-admin
subjects:
  - kind: ServiceAccount
    name: k8s-watch
    namespace: portfolio-public
roleRef:
  kind: Role
  name: k8s-watch-admin-reader
  apiGroup: rbac.authorization.k8s.io
